events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # =======================================================
    # 0. DEFAULT HTTP BLOCK (БЛОКУВАННЯ ВСІХ ЧУЖИХ ДОМЕНІВ НА 80 ПОРТУ)
    # =======================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # =======================================================
    # 1. SERVER 1: HTTP (Порт 80) - Відповідає за редирект на HTTPS
    # =======================================================
    server {
        listen 80; # ТУТ НЕ МАЄ БУТИ default_server
        server_name resthillvilla.com www.resthillvilla.com;
        return 301 https://$host$request_uri;
    }

    # =======================================================
    # 2. DEFAULT HTTPS BLOCK (БЛОКУВАННЯ ВСІХ ЧУЖИХ ДОМЕНІВ НА 443 ПОРТУ)
    # =======================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        # Використовуємо ТІ Ж САМІ SSL-сертифікати
        ssl_certificate /etc/nginx/certs/live/resthillvilla.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/resthillvilla.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 444;
    }

    # =======================================================
    # 3. SERVER 2: HTTPS (Порт 443) - Обслуговує Vue-додаток та API
    # =======================================================
    server {
        listen 443 ssl; # ТУТ НЕ МАЄ БУТИ default_server
        server_name resthillvilla.com www.resthillvilla.com;

        # Решта вашої конфігурації...
        ssl_certificate /etc/nginx/certs/live/resthillvilla.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/resthillvilla.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            }

        location /api/ {
            proxy_pass http://server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}