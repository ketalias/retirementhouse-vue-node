services:
  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - server
    networks:
      - webnet
    mem_limit: 64m
    cpus: 0.5

  server:
    build: ./server
    restart: always
    expose:
      - "3000"
    networks:
      - webnet
    mem_limit: 300m
    cpus: 1.0

networks:
  webnet:
